version: 2

updates:
  - package-ecosystem: uv
    directory: /
    groups:
      python:
        patterns:
          - "*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    groups:
      actions:
        patterns:
          - "*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: cargo
    directory: /  # one workspace, one Cargo.lock
    groups:
      cargo:
        patterns:
          - "*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
