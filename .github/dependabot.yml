version: 2

updates:
  - package-ecosystem: uv
    directory: /
    groups:
      python:
        patterns:
          - "*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    groups:
      actions:
        patterns:
          - "*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: cargo
    directory: /  # one workspace, one Cargo.lock
    groups:
      cargo:
        patterns:
          - "*"
    ignore:
      # workspace git tag pin; lockfile-only updates cause the drift in #287.
      # https://github.com/dependabot/dependabot-core/issues/13219
      - dependency-name: cryptography-x509
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
